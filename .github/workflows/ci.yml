# 双端门禁。
#
# ## 为什么 CI 里必须同时构建两个包
#
# 微信和抖音共用一份 `src/`，平台差异靠 `__TARGET__` 在构建期选中。
# 这个模型最危险的不是编译失败（那样一眼就看到），而是**平台代码漏进对面包**：
# 微信端一切正常，抖音端「点了没反应」，零报错。本地几乎不会主动去检查另一端。
#
# 所以每次 push 都跑一遍 `verify-targets`：双构建 + 交叉 grep + 脚手架字段断言。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: 前端 · 类型 + 单测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: games/line/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  targets:
    name: 双端产物门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: games/line/package-lock.json
      - run: npm ci

      # 小游戏构建强制要求非环回的 API_BASE（见 scripts/api-base.ts）。
      # CI 用占位域名 —— 这里验的是「包干净不干净」，不是「能不能连上后端」。
      - name: 双端构建 + 断言
        run: API_BASE=https://api.example.com npm run verify:targets:build

      # 失败时把两次产物的大小打出来，方便判断是不是有人不小心引了大依赖
      - name: 产物体积
        if: always()
        run: ls -lh ../line-wx/dist/game.js ../line-dy/dist/game.js

  server:
    name: 服务端 · 编译
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...
      # 单测里有一部分要连库（本地用真库跑的），CI 没有 Postgres，
      # 所以这里只做编译与静态检查。想跑全量测试就加 services: postgres。

# 生产 docker-compose（环境变量注入，密码/密钥不进仓库）。
# 用法：在 server/ 目录执行
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fgame
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fgame
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: always

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "postgres://fgame:${DB_PASSWORD}@postgres:5432/fgame?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      WECHAT_APPID: "${WECHAT_APPID}"
      WECHAT_SECRET: "${WECHAT_SECRET}"
      WECHAT_MOCK: "false"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../data:/app/data

volumes:
  pg-data:
  redis-data:

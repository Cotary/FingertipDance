# 生产 docker-compose（环境变量注入，密码/密钥不进仓库）。
# 用法：在 server/ 目录执行
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fgame
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fgame
      # ## 时区必须跟业务侧对齐
      #
      # 业务按东八区判断「今天」（`skips.day`、每日跳关额度、签到），
      # 而 Postgres 容器默认 UTC —— 后台统计用的 `created_at::date`
      # 与业务口径会差 8 小时：凌晨 0~8 点的注册/活跃被算进前一天，
      # 两边的「今日」永远对不上，且不会报任何错。
      #
      # `TZ` 影响容器与 initdb 的默认时区，`PGTZ` 影响客户端连接会话的
      # `timezone`（`::date` 转换按会话时区走），两个都要设。
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: always

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "postgres://fgame:${DB_PASSWORD}@postgres:5432/fgame?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET}"
      WECHAT_APPID: "${WECHAT_APPID}"
      WECHAT_SECRET: "${WECHAT_SECRET}"
      WECHAT_MOCK: "false"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../data:/app/data

volumes:
  pg-data:
  redis-data:

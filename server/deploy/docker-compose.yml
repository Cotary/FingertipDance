services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fgame
      POSTGRES_PASSWORD: fgame
      POSTGRES_DB: fgame
    ports:
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "postgres://fgame:fgame@postgres:5432/fgame?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "change-me-in-prod"
      WECHAT_MOCK: "true"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  pg-data:
  redis-data:

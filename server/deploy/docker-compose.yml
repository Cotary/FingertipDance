services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fgame
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_DSN: "root:root@tcp(mysql:3306)/fgame?charset=utf8mb4&parseTime=true&loc=Local&multiStatements=true"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "change-me-in-prod"
      WECHAT_MOCK: "true"
    depends_on:
      - mysql
      - redis
    volumes:
      - ../data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  mysql-data:
  redis-data:
